[package]
name = "aomi-progenitor-impl"
version = "0.14.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/aomi-labs/aomi-sdk"
description = "OpenAPI client generator for Aomi packages: progenitor 0.14 retargeted to aomi_sdk::http"

[dependencies]
heck = "0.5"
indexmap = "2"
openapiv3 = "2.2"
proc-macro2 = "1"
quote = "1"
schemars = { version = "0.8.22", features = ["chrono", "uuid1"] }
serde_json = "1"
thiserror = "2"
typify = "0.6.2"
unicode-ident = "1"

[dev-dependencies]
serde_yaml = "0.9"
