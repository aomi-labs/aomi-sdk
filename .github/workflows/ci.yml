name: CI

on:
  pull_request:
    branches: [main, publish]
  push:
    branches: [main, publish]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (native)
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

      - name: Clippy (wasm32-wasip2)
        run: cargo clippy -p aomi-sdk -p hello-reader -p keyed-header --target wasm32-wasip2 -- -Dwarnings

      - name: Test (native)
        run: cargo test --workspace --all-features

      - name: Build SDK and examples (wasm32-wasip2)
        run: cargo build -p aomi-sdk -p hello-reader -p keyed-header --target wasm32-wasip2 --release

      - name: Build generator crates and fixture (wasm32-wasip2)
        run: cargo build -p aomi-progenitor-client -p aomi-progenitor-fixture --target wasm32-wasip2
