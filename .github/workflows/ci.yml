name: CI

on:
  pull_request:
    branches: [main, publish]
  push:
    branches: [main, publish]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ffi-compatibility:
    name: Historical FFI compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Load historical SDK binaries in the new host
        run: cargo test -p aomi-sdk --test ffi_compatibility -- --nocapture
      - name: Check FFI formatting
        run: cargo fmt --all -- --check
      - name: Check release FFI policy
        run: python3 -m unittest discover -s scripts -p 'test_release_ffi.py'

  check:
    name: Check & Test
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SDK version bump
        id: sdk-version
        env:
          SDK_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/check_sdk_version_bump.py \
            --base "$SDK_BASE_SHA" \
            --head "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --lib -- -Dwarnings

      - name: Test SDK
        # Historical fixture binaries use immutable SDK revisions, not this PR.
        run: cargo test -p aomi-sdk


      - name: Dry-run SDK publish
        if: steps.sdk-version.outputs.publish_sdk == 'true'
        run: cargo publish -p aomi-sdk --dry-run

      - name: Detect changed apps
        id: changed-apps
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- \
            'apps/*/Cargo.toml' \
            'apps/*/build.rs' \
            'apps/*/src/**' \
            'apps/*/tests/**' \
            | sed -n 's|^apps/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ' ')
          echo "apps=$changed" >> "$GITHUB_OUTPUT"
          echo "Changed apps: $changed"

      - name: Check apps (fmt + clippy + compile tests)
        if: steps.changed-apps.outputs.apps != ''
        run: |
          failed=0
          for app_name in ${{ steps.changed-apps.outputs.apps }}; do
            manifest="apps/$app_name/Cargo.toml"
            [ -f "$manifest" ] || continue
            echo "::group::$app_name"
            cargo fmt --manifest-path "$manifest" -- --check || failed=1
            cargo clippy --manifest-path "$manifest" --lib -- -Dwarnings || failed=1
            cargo test --manifest-path "$manifest" --no-run || failed=1
            echo "::endgroup::"
          done
          exit $failed

      - name: Build aomi-build CLI
        run: cargo build -p aomi-sdk --features cli --bin aomi-build

      - name: Test aomi-build CLI
        run: cargo test -p aomi-sdk --features cli --bin aomi-build

      - name: Build local runtime binary (aomi-run)
        run: cargo build -p aomi-sdk --features dev-runtime --bin aomi-run

      - name: Build all plugins
        run: cargo run -p aomi-sdk --features cli --bin aomi-build -- compile
