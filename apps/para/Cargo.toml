[package]
name = "para"
version = "0.1.0"
edition = "2024"

# Hidden from the official bundle (2026-09-04): the Para wallet app adds no
# user-facing utility in the hosted runtime (Para is already a host signer).
# Code stays; flip `skip` to re-enable.
[package.metadata.aomi]
skip = true

[lib]
crate-type = ["cdylib"]

[dependencies]
aomi-sdk = { path = "../../sdk" }
progenitor-client = "0.14"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
regress = "0.10"
# Match progenitor-client's reqwest version so curated tool layers can wrap
# `Client::new_with_client(...)` with header-injecting middleware for auth.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
