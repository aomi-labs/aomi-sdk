openapi: 3.0.1
info:
  title: GeckoTerminal API V2
  description: "GeckoTerminal Public API endpoints.\n\n## Beta Release\nThe API is in its Beta release, and is subject to frequent changes.\nHowever, we aim to provide minimal disruption, and setting the request version would help avoid unexpected issues.\n\n**Please subscribe via [this form](https://forms.gle/jSMu4jLQBXeiVD1U9) to be notified of important API updates.**\n\n## Base URL\nAll endpoints below use the base URL: `https://api.geckoterminal.com/api/v2`\n\n## Versioning\nIt is recommended to set the API version via the `Accept` header.\nThe current version is **20230203**.\n\nFor example, to specify the current version, set header `Accept: application/json;version=20230203`.\n\n_If no version is specified, the latest version will be used._\n\n## Data Freshness\nAll endpoints listed below are cached for **1 minute**\n\nAll data is updated **as fast as 2-3 seconds** after a transaction is confirmed on the blockchain, subject to the network's availability.\n\n## Rate Limit\nThis Public API is limited to approximately 10 calls/minute, which may fluctuate based on network traffic.\nFor higher and more stable rate limits please subscribe to any CoinGecko API paid plan to access higher rate limit for GeckoTerminal endpoints (known as /onchain endpoints) or learn more at [CoinGecko](https://www.coingecko.com/en/api/pricing). \n\nTo share with us your feedback about the public API, let us know [here](https://forms.gle/jSMu4jLQBXeiVD1U9)!\n"
  version: v2-beta
servers:
- url: /api/v2
paths:
  /networks/{network}/pools/{pool_address}/ohlcv/{timeframe}:
    get:
      tags:
      - OHLCV
      summary: Pool OHLCV chart by Pool Address
      description: This endpoint allows you to **get the OHLCV chart (Open, High, Low, Close, Volume) of a pool based on the provided pool address on a network**
      operationId: getnetworks_network_pools_pooladdress_ohlcv_timeframe
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: path
        name: pool_address
        description: pool contract address
        required: true
        schema:
          example: 0x60594a405d53811d3bc4766596efd80fd545a270
          type: string
        style: simple
      - in: path
        name: timeframe
        description: timeframe of the OHLCV chart
        required: true
        schema:
          type: string
          enum:
          - day
          - hour
          - minute
        style: simple
      - in: query
        name: aggregate
        description: time period to aggregate for each OHLCV<br><br><b>Available values (day):</b> `1`<br><br><b>Available values (hour):</b> `1`, `4`, `12`<br><br><b>Available values (minute):</b> `1`, `5`, `15`
        schema:
          default: '1'
          type: string
        style: form
      - in: query
        name: before_timestamp
        description: return OHLCV data before this timestamp (integer seconds since epoch)
        schema:
          example: '1679414400'
          type: string
        style: form
      - in: query
        name: limit
        description: number of OHLCV results to return, maximum 1000
        schema:
          default: 100
          type: integer
          maximum: 1000
        style: form
      - in: query
        name: currency
        description: return OHLCV in USD or quote token
        schema:
          default: usd
          type: string
          enum:
          - usd
          - token
        style: form
      - in: query
        name: include_empty_intervals
        description: include empty intervals with no trade data
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: token
        description: 'return OHLCV for token<br>use this to invert the chart<br>Available values: ''base'', ''quote'', or token address'
        schema:
          default: base
          type: string
        examples:
          base:
            value: base
          quote:
            value: quote
          base_token_address:
            value: 0x6b175474e89094c44da98b954eedeac495271d0f
          quote_token_address:
            value: 0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
        style: form
      responses:
        '200':
          description: Get OHLCV data of a pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ohlcv'
  /networks/{network}/dexes:
    get:
      tags:
      - Dexes
      summary: Supported Dexes List by Network (ID Map)
      description: This endpoint allows you to **query all the supported decentralized exchanges (DEXs) based on the provided network on GeckoTerminal**
      operationId: getnetworks_network_dexes
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: query
        name: page
        description: page through results
        schema:
          type: integer
        style: form
      responses:
        '200':
          description: Get list of supported DEXs on a network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dexes_list'
  /networks:
    get:
      tags:
      - Networks
      summary: Supported Networks List (ID Map)
      description: This endpoint allows you to **query all the supported networks on GeckoTerminal**
      operationId: getnetworks
      parameters:
      - in: query
        name: page
        description: 'page through results (maximum: 10)'
        schema:
          type: integer
          maximum: 10
        style: form
      responses:
        '200':
          description: Get list of supported networks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networks_list'
  /networks/trending_pools:
    get:
      tags:
      - Pools
      summary: Trending Pools List
      description: This endpoint allows you to **query all the trending pools across all networks on GeckoTerminal**
      operationId: getnetworks_trendingpools
      parameters:
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `base_token`, `quote_token`, `dex`, `network`
        schema:
          type: string
        examples:
          one value:
            value: base_token
          multiple values:
            value: base_token,quote_token
        style: form
      - in: query
        name: include_gt_community_data
        description: include GT community data
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: page
        description: 'page through results (maximum: 10)'
        schema:
          type: integer
          maximum: 10
        style: form
      - in: query
        name: duration
        description: duration to sort trending list by
        schema:
          type: string
          enum:
          - 5m
          - 1h
          - 6h
          - 24h
        style: form
      responses:
        '200':
          description: Get trending pools across all networks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pool'
  /networks/{network}/trending_pools:
    get:
      tags:
      - Pools
      summary: Trending Pools by Network
      description: This endpoint allows you to **query the trending pools based on the provided network**
      operationId: getnetworks_network_trendingpools
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `base_token`, `quote_token`, `dex`
        schema:
          type: string
        examples:
          one value:
            value: base_token
          multiple values:
            value: base_token,quote_token
        style: form
      - in: query
        name: include_gt_community_data
        description: include GT community data
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: page
        description: 'page through results (maximum: 10)'
        schema:
          type: integer
          maximum: 10
        style: form
      - in: query
        name: duration
        description: duration to sort trending list by
        schema:
          type: string
          enum:
          - 5m
          - 1h
          - 6h
          - 24h
        style: form
      responses:
        '200':
          description: Get trending pools on a network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pool'
  /networks/{network}/pools/{address}:
    get:
      tags:
      - Pools
      summary: Specific Pool Data by Pool Address
      description: This endpoint allows you to **query the specific pool based on the provided network and pool address**
      operationId: getnetworks_network_pools_address
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: path
        name: address
        description: pool address
        required: true
        schema:
          example: 0x60594a405d53811d3bc4766596efd80fd545a270
          type: string
        style: simple
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `base_token`, `quote_token`, `dex`
        schema:
          type: string
        examples:
          one value:
            value: base_token
          multiple values:
            value: base_token,quote_token
        style: form
      - in: query
        name: include_volume_breakdown
        description: include volume breakdown
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: include_composition
        description: include pool composition
        schema:
          default: false
          type: boolean
        style: form
      responses:
        '200':
          description: Get specific pool on a network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/single_pool_detail'
  /networks/{network}/pools/multi/{addresses}:
    get:
      tags:
      - Pools
      summary: Multiple Pools Data by Pool Addresses
      description: This endpoint allows you to **query multiple pools based on the provided network and pool address**
      operationId: getnetworks_network_pools_multi_addresses
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: path
        name: addresses
        description: pool contract address, comma-separated if more than one pool contract address (up to 30 addresses)
        required: true
        schema:
          type: string
        examples:
          one value:
            value: 0x60594a405d53811d3bc4766596efd80fd545a270
          multiple values:
            value: 0x60594a405d53811d3bc4766596efd80fd545a270,0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640
        style: simple
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `base_token`, `quote_token`, `dex`
        schema:
          type: string
        examples:
          one value:
            value: base_token
          multiple values:
            value: base_token,quote_token
        style: form
      - in: query
        name: include_volume_breakdown
        description: include volume breakdown
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: include_composition
        description: include pool composition
        schema:
          default: false
          type: boolean
        style: form
      responses:
        '200':
          description: Get multiple pools on a network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/multi_pool_details'
  /networks/{network}/pools:
    get:
      tags:
      - Pools
      summary: Top Pools by Network
      description: This endpoint allows you to **query all the top pools based on the provided network**
      operationId: getnetworks_network_pools
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `base_token`, `quote_token`, `dex`
        schema:
          type: string
        examples:
          one value:
            value: base_token
          multiple values:
            value: base_token,quote_token
        style: form
      - in: query
        name: include_gt_community_data
        description: include GT community data
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: page
        description: 'page through results (maximum: 10)'
        schema:
          type: integer
          maximum: 10
        style: form
      - in: query
        name: sort
        description: sort the pools by field
        schema:
          type: string
          enum:
          - h24_volume_usd_desc
          - h24_tx_count_desc
        style: form
      responses:
        '200':
          description: Get top pools on a network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pool'
  /networks/{network}/dexes/{dex}/pools:
    get:
      tags:
      - Pools
      summary: Top Pools by Dex
      description: This endpoint allows you to **query all the top pools based on the provided network and decentralized exchange (DEX)**
      operationId: getnetworks_network_dexes_dex_pools
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: path
        name: dex
        description: DEX ID<br>*refers to [/networks/{network}/dexes](/api/v2/networks/eth/dexes)
        required: true
        schema:
          example: sushiswap
          type: string
        style: simple
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `base_token`, `quote_token`, `dex`
        schema:
          type: string
        examples:
          one value:
            value: base_token
          multiple values:
            value: base_token,quote_token
        style: form
      - in: query
        name: include_gt_community_data
        description: include GT community data
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: page
        description: 'page through results (maximum: 10)'
        schema:
          type: integer
          maximum: 10
        style: form
      - in: query
        name: sort
        description: sort the pools by field
        schema:
          type: string
          enum:
          - h24_volume_usd_desc
          - h24_tx_count_desc
        style: form
      responses:
        '200':
          description: Get top pools on a network's dex
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pool'
  /networks/{network}/tokens/{token_address}/pools:
    get:
      tags:
      - Tokens
      summary: Top Pools by Token Address
      description: This endpoint allows you to **query top pools based on the provided token contract address on a network**
      operationId: getnetworks_network_tokens_tokenaddress_pools
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: path
        name: token_address
        description: token contract address
        required: true
        schema:
          example: 0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
          type: string
        style: simple
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `base_token`, `quote_token`, `dex`
        schema:
          type: string
        examples:
          one value:
            value: base_token
          multiple values:
            value: base_token,quote_token
        style: form
      - in: query
        name: include_inactive_source
        description: include inactive pools when sourcing for token's top pool
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: page
        description: 'page through results (maximum: 10)'
        schema:
          type: integer
          maximum: 10
        style: form
      - in: query
        name: sort
        description: sort the pools by field
        schema:
          type: string
          enum:
          - h24_volume_usd_desc
          - h24_tx_count_desc
          - h24_volume_usd_liquidity_desc
        style: form
      responses:
        '200':
          description: Get top pools for a token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pool'
  /networks/{network}/new_pools:
    get:
      tags:
      - Pools
      summary: New Pools by Network
      description: This endpoint allows you to **query all the latest pools based on provided network**
      operationId: getnetworks_network_newpools
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `base_token`, `quote_token`, `dex`
        schema:
          type: string
        examples:
          one value:
            value: base_token
          multiple values:
            value: base_token,quote_token
        style: form
      - in: query
        name: include_gt_community_data
        description: include GT community data
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: page
        description: 'page through results (maximum: 10)'
        schema:
          type: integer
          maximum: 10
        style: form
      responses:
        '200':
          description: Get latest pools on a network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pool'
  /networks/new_pools:
    get:
      tags:
      - Pools
      summary: New Pools List
      description: This endpoint allows you to **query all the latest pools across all networks on GeckoTerminal**
      operationId: getnetworks_newpools
      parameters:
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `base_token`, `quote_token`, `dex`, `network`
        schema:
          type: string
        examples:
          one value:
            value: base_token
          multiple values:
            value: base_token,quote_token
        style: form
      - in: query
        name: include_gt_community_data
        description: include GT community data
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: page
        description: 'page through results (maximum: 10)'
        schema:
          type: integer
          maximum: 10
        style: form
      responses:
        '200':
          description: Get latest pools across all networks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pool'
  /search/pools:
    get:
      tags:
      - Pools
      summary: Search Pools
      description: This endpoint allows you to **search for pools on a network**
      operationId: getsearch_pools
      parameters:
      - in: query
        name: query
        description: search query
        schema:
          example: weth
          type: string
        style: form
      - in: query
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        schema:
          example: eth
          type: string
        style: form
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `base_token`, `quote_token`, `dex`
        schema:
          type: string
        examples:
          one value:
            value: base_token
          multiple values:
            value: base_token,quote_token
        style: form
      - in: query
        name: page
        description: 'page through results (maximum: 10)'
        schema:
          type: integer
          maximum: 10
        style: form
      responses:
        '200':
          description: Search for pools on a network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pool'
  /networks/{network}/pools/{pool_address}/trades:
    get:
      tags:
      - Trades
      summary: Past 24 Hour Trades by Pool Address
      description: This endpoint allows you to **query the last 300 trades in the past 24 hours based on the provided pool address**
      operationId: getnetworks_network_pools_pooladdress_trades
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: path
        name: pool_address
        description: pool contract address
        required: true
        schema:
          example: 0x60594a405d53811d3bc4766596efd80fd545a270
          type: string
        style: simple
      - in: query
        name: trade_volume_in_usd_greater_than
        description: filter trades by trade volume in USD greater than this value
        schema:
          example: 100000
          default: 0
          type: number
        style: form
      - in: query
        name: token
        description: 'return trades for token<br>use this to invert the data<br>Available values: ''base'', ''quote'', or token address'
        schema:
          default: base
          type: string
        examples:
          base:
            value: base
          quote:
            value: quote
          base_token_address:
            value: 0x6b175474e89094c44da98b954eedeac495271d0f
          quote_token_address:
            value: 0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
        style: form
      responses:
        '200':
          description: Get last 300 trades in past 24 hours from a pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trade'
  /networks/{network}/tokens/{address}:
    get:
      tags:
      - Tokens
      summary: Token Data by Token Address
      description: This endpoint allows you to **query specific token data based on the provided token contract address on a network**
      operationId: getnetworks_network_tokens_address
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: path
        name: address
        description: token contract address
        required: true
        schema:
          example: 0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
          type: string
        style: simple
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `top_pools`
        schema:
          type: string
        examples:
          one value:
            value: top_pools
        style: form
      - in: query
        name: include_composition
        description: include pool composition
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: include_inactive_source
        description: include inactive pools when sourcing for token's top pool
        schema:
          default: false
          type: boolean
        style: form
      responses:
        '200':
          description: Get specific token on a network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/token_detail'
  /networks/{network}/tokens/multi/{addresses}:
    get:
      tags:
      - Tokens
      summary: Tokens Data by Token Addresses
      description: This endpoint allows you to **query multiple tokens data based on the provided token contract addresses on a network**
      operationId: getnetworks_network_tokens_multi_addresses
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: path
        name: addresses
        description: token contract address, comma-separated if more than one token contract address (up to 30 addresses)
        required: true
        schema:
          type: string
        examples:
          one value:
            value: 0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
          multiple values:
            value: 0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2,0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        style: simple
      - in: query
        name: include_inactive_source
        description: include inactive pools when sourcing for token's top pool
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `top_pools`
        schema:
          type: string
        examples:
          one value:
            value: top_pools
        style: form
      - in: query
        name: include_composition
        description: include pool composition
        schema:
          default: false
          type: boolean
        style: form
      responses:
        '200':
          description: Get multiple tokens on a network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/multi_token_detail'
  /networks/{network}/tokens/{address}/info:
    get:
      tags:
      - Tokens
      summary: Token Info by Token Address
      description: This endpoint allows you to **query token metadata (name, symbol,  CoinGecko ID, image, socials, websites, description, etc.) based on a provided token contract address on a network**
      operationId: getnetworks_network_tokens_address_info
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: path
        name: address
        description: token contract address
        required: true
        schema:
          example: 0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
          type: string
        style: simple
      responses:
        '200':
          description: Get specific token info on a network. Data may be sourced on-chain and is not vetted by the CoinGecko team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/token_info'
  /networks/{network}/pools/{pool_address}/info:
    get:
      tags:
      - Tokens
      summary: Pool Tokens Info by Pool Address
      description: This endpoint allows you to **query pool metadata (base and quote token details, image, socials, websites, description, contract address, etc.) based on a provided pool contract address on a network**
      operationId: getnetworks_network_pools_pooladdress_info
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: path
        name: pool_address
        description: pool contract address
        required: true
        schema:
          example: 0x60594a405d53811d3bc4766596efd80fd545a270
          type: string
        style: simple
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `pool`
        schema:
          type: string
        examples:
          one value:
            value: pool
        style: form
      responses:
        '200':
          description: Get pool tokens info on a network. Data may be sourced on-chain and is not vetted by the CoinGecko team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pool_tokens_info'
  /tokens/info_recently_updated:
    get:
      tags:
      - Tokens
      summary: Most Recently Updated Tokens List
      description: This endpoint allows you to **query 100 most recently updated tokens info of a specific network or across all networks on GeckoTerminal**
      operationId: gettokens_inforecentlyupdated
      parameters:
      - in: query
        name: include
        description: attributes to include, comma-separated if more than one to include<br><br><b>Available values:</b> `network`
        schema:
          type: string
        examples:
          one value:
            value: network
        style: form
      - in: query
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        schema:
          example: eth
          type: string
        style: form
      responses:
        '200':
          description: Get 100 tokens info across all networks ordered by most recently updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/token_info_recently_updated'
  /simple/networks/{network}/token_price/{addresses}:
    get:
      tags:
      - Simple
      summary: Token Price by Token Addresses
      description: This endpoint allows you to **get token price based on the provided token contract address on a network**
      operationId: getsimple_networks_network_tokenprice_addresses
      parameters:
      - in: path
        name: network
        description: network ID<br>*refers to [/networks](/api/v2/networks)
        required: true
        schema:
          example: eth
          type: string
        style: simple
      - in: path
        name: addresses
        description: token contract address, comma-separated if more than one token contract address (up to 30 addresses)
        required: true
        schema:
          type: string
        examples:
          one value:
            value: 0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
          multiple values:
            value: 0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2,0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        style: simple
      - in: query
        name: include_market_cap
        description: include market capitalization
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: mcap_fdv_fallback
        description: return FDV if market cap is not available
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: include_24hr_vol
        description: include 24hr volume
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: include_24hr_price_change
        description: include 24hr price change
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: include_total_reserve_in_usd
        description: include total reserve in USD
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: include_inactive_source
        description: include inactive pools when sourcing for token's top pool
        schema:
          default: false
          type: boolean
        style: form
      responses:
        '200':
          description: Get current USD prices of multiple tokens on a network
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/simple_token_price'
