[package]
name = "oneinch"
version = "0.1.0"
edition = "2024"

# Hidden from the official bundle (2026-09-04): 1inch requires KYC for API
# keys. Code stays; flip `skip` to re-enable.
[package.metadata.aomi]
skip = true

[lib]
crate-type = ["cdylib"]

[dependencies]
aomi-sdk = { path = "../../sdk" }
aomi-ext = { path = "../../ext", features = ["oneinch"] }
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
