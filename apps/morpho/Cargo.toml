[package]
name = "morpho"
version = "0.1.0"
edition = "2024"

# Retired from the official bundle (2026-09-06): Morpho Blue + vault reads now
# live in the product-mono `morpho` skill (injected tools + vault-aware guard).
# Code stays for reference; flip `skip` to re-enable.
[package.metadata.aomi]
skip = true

[lib]
crate-type = ["cdylib"]

[dependencies]
aomi-sdk = { path = "../../sdk" }
aomi-ext = { path = "../../ext", features = ["morpho"] }
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
