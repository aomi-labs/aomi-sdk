[package]
name = "morpho-vaults"
version = "0.1.0"
edition = "2024"
description = "Morpho Vault monitor and deposit/withdraw assistant for Vault V1 and Vault V2"

# Retired from the official bundle (2026-09-06): superseded by the product-mono
# `morpho` skill (six injected vault tools + vault-aware guard). Code stays for
# reference; flip `skip` to re-enable.
[package.metadata.aomi]
skip = true

[lib]
crate-type = ["cdylib"]

[dependencies]
aomi-sdk = { path = "../../sdk" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
