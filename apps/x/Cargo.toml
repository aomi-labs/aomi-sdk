[package]
name = "x"
version = "0.2.0"
edition = "2024"
description = "Read-only X (Twitter) app on the official X API v2: profiles, timelines, search, trends, posts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aomi-sdk = { path = "../../sdk" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "json", "query", "rustls"] }
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
