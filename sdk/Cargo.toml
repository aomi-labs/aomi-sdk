[package]
name = "aomi-sdk"
version = "8.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/aomi-labs/aomi-sdk"
description = "Guest SDK for Aomi packages (aomi:package@1.0.0 WebAssembly components) and the aomi-build CLI"

[features]
default = []
# Compile the `aomi-build` binary and its supporting
# modules. Off by default so library consumers don't drag in
# clap/tokio/reqwest/progenitor/syn just to depend on the SDK. Enable via
# `cargo install aomi-sdk --features cli` or
# `cargo build -p aomi-sdk --features cli`.
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:reqwest",
    "dep:tokio",
    "dep:toml",
    "dep:inquire",
    "dep:serde_yaml",
    "dep:chrono",
    "dep:aomi-progenitor-impl",
    "dep:openapiv3",
    "dep:indexmap",
    "dep:prettyplease",
    "dep:syn",
    "dep:proc-macro2",
    "dep:toml_edit",
    "dep:jsonwebtoken",
    "dep:open",
    "dep:base64",
    "dep:uuid",
    "dep:eyre",
    "dep:sha2",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0.4"
serde_urlencoded = "0.7"
wit-bindgen = "=0.63.0"
wstd = "=0.6.8"

# Optional deps — pulled in only when the `cli` feature is enabled.
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
toml = { version = "0.8", optional = true }
inquire = { version = "0.7", optional = true }
serde_yaml = { version = "0.9", optional = true }
chrono = { workspace = true, features = ["serde"], optional = true }
aomi-progenitor-impl = { path = "../progenitor-impl", version = "0.14", optional = true }
openapiv3 = { version = "2.2", optional = true }
indexmap = { version = "2", optional = true }
prettyplease = { version = "0.2", optional = true }
syn = { version = "2", features = ["full"], optional = true }
proc-macro2 = { version = "1", optional = true }
toml_edit = { version = "0.22", optional = true }
jsonwebtoken = { version = "9", optional = true }
open = { version = "5", optional = true }
base64 = { workspace = true, optional = true }
eyre = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[[bin]]
name = "aomi-build"
path = "bin/build/main.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tempfile = "3"
