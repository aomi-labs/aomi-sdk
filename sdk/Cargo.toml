[package]
name = "aomi-sdk"
version = "8.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/aomi-labs/aomi-sdk"
description = "Guest SDK for Aomi packages (aomi:package@1.0.0 WebAssembly components) and the aomi-build CLI"

[features]
default = []
# Compile the `aomi-build` binary and its supporting
# modules. Off by default so library consumers don't drag in
# clap/reqwest/progenitor/syn just to depend on the SDK. Enable via
# `cargo install aomi-sdk --features cli` or
# `cargo build -p aomi-sdk --features cli`.
cli = [
    "dep:clap",
    "dep:reqwest",
    "dep:toml",
    "dep:inquire",
    "dep:serde_yaml",
    "dep:chrono",
    "dep:aomi-progenitor-impl",
    "dep:openapiv3",
    "dep:indexmap",
    "dep:prettyplease",
    "dep:syn",
    "dep:proc-macro2",
    "dep:toml_edit",
    "dep:eyre",
    "dep:sha2",
    "dep:roxmltree",
]
# `chain::evm(id).at(view).provider()`: an alloy `RootProvider` over the
# host's `evm-read`. Pins the alloy core crates to one coherent release.
alloy = [
    "dep:alloy-json-rpc",
    "dep:alloy-primitives",
    "dep:alloy-provider",
    "dep:alloy-rpc-client",
    "dep:alloy-rpc-types-eth",
    "dep:alloy-sol-macro",
    "dep:alloy-sol-macro-expander",
    "dep:alloy-sol-macro-input",
    "dep:alloy-sol-type-parser",
    "dep:alloy-sol-types",
    "dep:alloy-transport",
    "dep:tower",
]
# `svm`: decode unsigned Solana transactions and resolve their lookup tables.
svm = ["dep:base64", "dep:bs58"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0.4"
serde_urlencoded = "0.7"
wit-bindgen = "=0.63.0"
wstd = "=0.6.8"

# `alloy` feature. Core crates on 1.5.7 exactly, provider crates on 1.7.3
# (spike S5a): a newer sol macro or type parser does not build against 1.5.7.
alloy-json-rpc = { version = "=1.7.3", default-features = false, optional = true }
alloy-primitives = { version = "=1.5.7", default-features = false, optional = true }
alloy-provider = { version = "=1.7.3", default-features = false, optional = true }
alloy-rpc-client = { version = "=1.7.3", default-features = false, optional = true }
alloy-rpc-types-eth = { version = "=1.7.3", default-features = false, optional = true }
alloy-sol-macro = { version = "=1.5.7", optional = true }
alloy-sol-macro-expander = { version = "=1.5.7", optional = true }
alloy-sol-macro-input = { version = "=1.5.7", optional = true }
alloy-sol-type-parser = { version = "=1.5.7", default-features = false, optional = true }
alloy-sol-types = { version = "=1.5.7", default-features = false, optional = true }
alloy-transport = { version = "=1.7.3", default-features = false, optional = true }
tower = { version = "0.5", default-features = false, optional = true }

# `svm` feature.
bs58 = { version = "0.5", optional = true }

# Optional deps — pulled in only when the `cli` feature is enabled.
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { workspace = true, optional = true }
toml = { version = "0.8", optional = true }
inquire = { version = "0.7", optional = true }
serde_yaml = { version = "0.9", optional = true }
chrono = { workspace = true, features = ["serde"], optional = true }
aomi-progenitor-impl = { path = "../progenitor-impl", version = "0.14", optional = true }
openapiv3 = { version = "2.2", optional = true }
indexmap = { version = "2", optional = true }
prettyplease = { version = "0.2", optional = true }
syn = { version = "2", features = ["full"], optional = true }
proc-macro2 = { version = "1", optional = true }
toml_edit = { version = "0.22", optional = true }
base64 = { workspace = true, optional = true }
eyre = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
roxmltree = { version = "0.21", optional = true }

[[bin]]
name = "aomi-build"
path = "bin/build/main.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tempfile = "3"
