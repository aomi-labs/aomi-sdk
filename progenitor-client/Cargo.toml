[package]
name = "aomi-progenitor-client"
version = "0.14.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/aomi-labs/aomi-sdk"
description = "Runtime for Aomi package clients generated by aomi-build gen-client"

[dependencies]
aomi-sdk = { path = "../sdk", version = "8" }
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_urlencoded = "0.7"
